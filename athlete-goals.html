<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Goals - Nomadic Performance</title>
  <link rel="stylesheet" href="css/style.css" />
  <script defer src="js/analytics.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script defer src="js/supabase-config.js"></script>
  <script defer src="js/auth-ui.js"></script>
  <script defer src="js/athlete-goals.js"></script>
</head>
<body>

  <header>
    <div class="brand">
      <img src="img/nomadicPerformanceLogo.png" alt="Nomadic Performance" class="logo-img" />
      <h1>Nomadic Performance</h1>
      <p>Move Free, Thrive Wild</p>
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="services.html">Services</a>
      <a href="blog.html">Blog</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <main class="profile-main">
    <div class="profile-container">
      <div data-goals-guard>
        <p class="profile-loading">Loading goals...</p>
      </div>

      <div class="profile-content" hidden data-goals-content>
        <div class="profile-dashboard-heading-row">
          <div>
            <h1 class="section-heading">Manage Goals and Milestones</h1>
            <p class="profile-dashboard-subtitle">Add and manage races, events, trips, and performance targets.</p>
          </div>
          <a href="profile.html" class="btn profile-btn-cancel">Back to Dashboard</a>
        </div>

        <div class="profile-section">
          <div class="profile-goals-countdown" data-goals-countdown>
            <p class="profile-loading">Loading next countdown...</p>
          </div>

          <form class="profile-goals-form" data-goals-form>
            <div class="form-row profile-goals-form-row">
              <div class="form-group">
                <label for="goal-type">Type</label>
                <select id="goal-type" name="goal_type" data-goal-type>
                  <option value="goal">General Goal</option>
                  <option value="specific_goal">Specific Goal</option>
                  <option value="race">Race</option>
                  <option value="event">Event</option>
                  <option value="trip">Trip</option>
                  <option value="milestone">Milestone</option>
                </select>
              </div>

              <div class="form-group">
                <label for="goal-target-date">Target Date</label>
                <input id="goal-target-date" name="target_date" type="date" data-goal-target-date />
              </div>
            </div>

            <div class="form-group">
              <label for="goal-title">Title</label>
              <input id="goal-title" name="title" type="text" maxlength="140" placeholder="e.g. Leadville MTB 100, Redpoint 5.12a, 3-day ski tour" required data-goal-title />
            </div>

            <div class="form-group">
              <label for="goal-details">Details</label>
              <textarea id="goal-details" name="details" rows="3" placeholder="Optional notes, target outcomes, or prep details" data-goal-details></textarea>
            </div>

            <div class="profile-form-actions">
              <button type="submit" class="btn profile-btn-save">Add Goal</button>
            </div>
          </form>

          <div class="profile-goals-list" data-goals-list>
            <p class="profile-loading">No goals added yet.</p>
          </div>

          <p class="profile-status" role="status" aria-live="polite" data-goals-status></p>
        </div>
      </div>
    </div>
  </main>

  <footer style="background: #0e4749; color: #fff; padding: 32px 0 16px 0; text-align: center; margin-top: 48px;">
    <p style="font-size: 1rem; opacity: 0.8;">&copy; 2026 Nomadic Performance. All rights reserved.</p>
  </footer>

</body>
</html>
