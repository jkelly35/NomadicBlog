<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Update Password - Nomadic Performance</title>
  <link rel="stylesheet" href="css/style.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script defer src="js/supabase-config.js"></script>
  <script defer src="js/update-password.js"></script>
</head>
<body>
  <main class="password-reset-main">
    <section class="password-reset-card">
      <h1>Set Your New Password</h1>
      <p class="password-reset-subtitle">Use a strong password you have not used elsewhere.</p>

      <form class="password-reset-form" data-password-reset-form>
        <label for="new-password">New Password</label>
        <input id="new-password" name="newPassword" type="password" minlength="8" autocomplete="new-password" required />

        <label for="confirm-password">Confirm New Password</label>
        <input id="confirm-password" name="confirmPassword" type="password" minlength="8" autocomplete="new-password" required />

        <button type="submit" class="btn password-reset-submit">Update Password</button>
      </form>

      <p class="password-reset-status" role="status" aria-live="polite" data-password-reset-status></p>
      <p class="password-reset-help">After updating, you will be redirected to your dashboard.</p>
    </section>
  </main>
</body>
</html>
